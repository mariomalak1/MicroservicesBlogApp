info:
  name: create post
  type: http
  seq: 1

http:
  method: POST
  url: "{{posts-service}}/posts-create"
  body:
    type: json
    data: |-
      {
        "title": "mario",
        "content": "from mario the first post"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
